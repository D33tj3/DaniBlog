<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>raad waar ik aan denk</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <div class="cutout">
    <h1 class="cutout-title">
      <span class="text"></span><span class="dot">.</span>
    </h1>
  </div>
</header>

<main class="game">
  <div id="result"></div>
<div class="cards">
  <div class="card-option" onclick="pick(0)"><p></p></div>
  <div class="card-option" onclick="pick(1)"><p></p></div>
  <div class="card-option" onclick="pick(2)"><p></p></div>
</div>



<div class="game-buttons">

  <a class="btn back-btn" href="index.html">← wat een kutspel</a>

  <button class="btn again-btn" onclick="resetGame()">opnieuw</button>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* ===== DATA ===== */

const answers = [
  "ik wil een hond",
  "zal ik een busje kopen en er in gaan wonen",
  "",
  "dit is niet echt een gedachte dit is ruis",
  "ik ben moe maar op een existentiële manier"
];

const wrongResponses = [
  "nope ❌",
  "oei, dat dacht ik echt een seconde geleden nog",
  "dit is pijnlijk fout",
  "ik dacht dat je me beter kende dan dit",
  "dat denk ik vaak, maar nu niet"
];

const rightResponses = [
  "jaaa klopt!",
  "hoe wist je dat?? omg",
  "kan je mijn gedachten lezen?!",
  "wow creepy",
  "ja, maar wanneer denk ik daar niet aan"
];

/* ===== LOAD CARDS ===== */

function loadCards() {
  const shuffled = [...answers].sort(() => Math.random() - 0.5);
  const cards = document.querySelectorAll(".card-option p");

  cards.forEach((p, i) => {
    p.textContent = shuffled[i];
  });
}

/* ===== GAME LOGIC ===== */

function pick(index) {
  const thought = document.querySelectorAll(".card-option p")[index].textContent;

  const isRight = Math.random() < 0.15;

  let response;

  if (isRight) {
    response = rightResponses[Math.floor(Math.random() * rightResponses.length)];

    confetti({
      particleCount: 120,
      spread: 70,
      origin: { y: 0.6 }
    });
  } else {
    response = wrongResponses[Math.floor(Math.random() * wrongResponses.length)];
  }

  document.getElementById("result").textContent =
    `${response} → ik dacht aan: "${thought}"`;
}

/* ===== INIT ===== */

document.addEventListener("DOMContentLoaded", () => {
  loadCards();
});
</script>



<script>
/* ===== TITLE TYPEWRITER ===== */

document.addEventListener("DOMContentLoaded", () => {
  const el = document.querySelector(".cutout-title .text");
  const parent = document.querySelector(".cutout-title");

  const text = "raad waar ik aan denk";
  let i = 0;

  function type() {
    if (i < text.length) {
      el.textContent += text[i];
      i++;
      setTimeout(type, 90);
    } else {
      parent.classList.add("done");
    }
  }

  type();
});
</script>

</body>
</html>
