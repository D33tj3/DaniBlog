<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Archivo+Black&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>raad waar ik aan denk</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="page-game">

<header class="hero">
  <div class="cutout">
    <h1 class="cutout-title">
      <span class="text"></span><span class="dot">.</span>
    </h1>
  </div>
</header>

<main class="game">
  <div id="result"></div>
<div class="cards">
  <div class="card-option" onclick="pick(0)"><p></p></div>
  <div class="card-option" onclick="pick(1)"><p></p></div>
  <div class="card-option" onclick="pick(2)"><p></p></div>
</div>



<section class="game-actions">
  <a class="btn btn-black" href="index.html">← wat een kutspel</a>
  <button class="btn btn-special" onclick="resetGame()">opnieuw</button>
</section>
<footer>
  © 2026 - leest het lekkerst met een korreltje zout
</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* ===== DATA ===== */

const answers = [
  "ik wil een hond",
  "zal ik een busje kopen en er in gaan wonen",
  "wat zegt het over mij dat de ene keer dat ik op reis wilde stoppen om een hitchhiker mee te nemen, het een Nederlander bleek te zijn terwijl er tig andere hitchhikers een lift nodig hadden",
  "zou ik al een pull-up kunnen?",
  "wat ben ik toch blij met jou",
  "is anxiety een self-fullfilling prophecy?",
  "ik heb echt zin in iets zoets",
  "misschien moet ik gewoon mijn laatste DUO centjes er doorheen jagen",
  "wat als ik gewoon in het buitenland ga wonen",
  "wat heb ik toch eigenlijk een fijn leven",
  "liefde is zo leuk",
  "wat als ik alles gewoon saboteer uit angst dat ik toch wel ga falen?",
  "voor iemand die echt een 'out of sight out of mind' persoon is, is het fijn dat ik zo veel goede vrienden heb die mij op den duur weer appen"
];

const wrongResponses = [
  "nope ❌",
  "🙈",
  "oei, dat dacht ik echt een seconde geleden nog",
  "jammeeerrr",
  "ik dacht dat je me beter kende dan dit",
  "dat denk ik vaak, maar nu niet",
  "hahah nee dat dacht ik niet",
  "wauw, ik kan niet geloven dat je denkt dat ik dat denk"
];

const rightResponses = [
  "jaaa klopt!",
  "hoe wist je dat?? omg",
  "kan je mijn gedachten lezen?!",
  "wow creepy",
  "ja, maar wanneer denk ik daar niet aan",
  "wat ken je me toch goed",
  "dit is waarom we vrienden zijn",
  "echt goed! wil je een sticker?",
  "hahah oke, ga mijn hersenen uit ofzo",
  "je hebt echt een gave"
];

// 💀 GAME STATE
let allowedToWin = false;
let winningIndex = -1;

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function loadCards() {

  const cards = document.querySelectorAll(".card-option p");

  const shown = shuffle(answers).slice(0, 3);

  cards.forEach((p, i) => {
    p.textContent = shown[i];
  });

  // 💀 HIER wordt de realiteit bepaald
  allowedToWin = Math.random() < 0.2; // 20% genade moment
  winningIndex = Math.floor(Math.random() * 3);

  document.getElementById("result").textContent = "";
}

function pick(index) {

  const cards = document.querySelectorAll(".card-option");
  const texts = document.querySelectorAll(".card-option p");

  const chosenCard = cards[index];

  // reset visuals
  cards.forEach(c => c.classList.remove("correct", "wrong"));

  let response;

  if (allowedToWin && index === winningIndex) {

    // 💚 JE WORDT GEGUND TE WINNEN
    chosenCard.classList.add("correct");

    response = rightResponses[Math.floor(Math.random() * rightResponses.length)];

    confetti({
      particleCount: 120,
      spread: 70,
      startVelocity: 40,
      origin: { y: 0.6 }
    });

  } else {

    // 💔 JE VERLIEST (altijd behalve zeldzaam moment)
    chosenCard.classList.add("wrong");

    response = wrongResponses[Math.floor(Math.random() * wrongResponses.length)];
  }

  // lock
  cards.forEach(c => c.classList.add("disabled"));

  document.getElementById("result").textContent = response;

  document.querySelector(".btn-special").classList.add("ready");
}

function resetGame() {

  document.querySelector(".btn-special").classList.remove("ready");

  document.querySelectorAll(".card-option").forEach(card => {
    card.classList.remove("correct", "wrong", "disabled");
  });

  loadCards();
}

document.addEventListener("DOMContentLoaded", loadCards);

/* ===== INIT ===== */

document.addEventListener("DOMContentLoaded", () => {
  loadCards();
});
</script>



<script>
/* ===== TITLE TYPEWRITER ===== */

document.addEventListener("DOMContentLoaded", () => {
  const el = document.querySelector(".cutout-title .text");
  const parent = document.querySelector(".cutout-title");

  const text = "raad waar ik aan denk";
  let i = 0;

  function type() {
    if (i < text.length) {
      el.textContent += text[i];
      i++;
      setTimeout(type, 90);
    } else {
      parent.classList.add("done");
    }
  }

  type();
});
</script>

</body>
</html>
